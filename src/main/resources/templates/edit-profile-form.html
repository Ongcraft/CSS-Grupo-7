<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Editar Perfil - TascaEats</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container edit-profile-form-container">

    <h2>Editar Perfil</h2>

    <form th:action="@{/web/profile/edit}" method="post" class="profile-form">

        <div class="form-group">
            <label>Nome</label>
            <input type="text" id="name" name="name" th:value="${customer.name}">
        </div>

        <div class="form-group">
            <label>Nome de Utilizador</label>
            <input type="text" name="username" th:value="${customer.username}">
        </div>

        <div class="form-group">
            <label>Nova Password</label>
            <input type="password" name="password" placeholder="Nova password">
        </div>

        <div class="edit-profile-actions">
            <button type="submit" class="edit-profile-button">Salvar</button>
            <a th:href="@{/web/profile}" class="cancel-profile-edit-button">
                <button type="button">Cancelar</button>
            </a>
        </div>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Carrinho - TascaEats</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container cart-container">

        <h2>Meu Carrinho</h2>

        <div th:if="${#lists.isEmpty(cartProducts)}">
            <p>O seu carrinho está vazio</p>
            <a th:href="@{/web/restaurants}">
                <button type="button">Voltar aos Restaurantes</button>
            </a>
        </div>

        <div th:if="${not #lists.isEmpty(cartProducts)}">
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Subtotal</th>
                        <th>Ação</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="item : ${cartProducts}">
                        <!-- Produto -->
                        <td th:text="${item.productName}"></td>

                        <!-- Preço -->
                        <td th:text="${#numbers.formatDecimal(item.productPrice, 1, 2)}"></td>

                        <!-- Quantidade -->
                        <td th:text="${item.quantity}"></td>

                        <!-- Subtotal -->
                        <td th:text="${#numbers.formatDecimal(item.productPrice * item.quantity, 1, 2)}"></td>

                        <!-- Remover -->
                        <td>
                            <form method="post" th:action="@{/web/cart/remove}">
                                <input type="hidden" name="productId" th:value="${item.productId}">
                                <button type="submit" class="remove-btn">Remover</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="cart-summary">
                <h3 th:text="'Total: ' + ${#numbers.formatDecimal(totalPrice, 1, 2)} + '€'"></h3>
            </div>

            <div class="cart-actions">
                <div class="create-order-action">
                    <a th:href="@{/web/orders/new}">
                        <button type="button">Criar Order</button>
                    </a>
                </div>
                <div class="clear-cart-action">
                    <form method="post" th:action="@{/web/cart/clear}">
                        <button type="submit">Limpar Carrinho</button>
                    </form>
                </div>
                <div class="back-action">
                    <a th:href="@{/web/dashboard}">
                        <button type="button">Voltar</button>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

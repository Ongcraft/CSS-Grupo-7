events {}

http {
    upstream tascaeats {
        server springbootapp:8080;
    }

    upstream delivery {
        server delivery-service:8081;
    }

    server {
        listen 80;

        location /delivery/ {
            proxy_pass http://delivery/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://tascaeats/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
